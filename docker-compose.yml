# Intentionally vulnerable, LOCAL-ONLY WordPress target for testing the tool.
# Bring it up:   docker compose up -d
# Seed users:    ./seed.sh
# Tear it down:  docker compose down -v
#
# User enumeration (REST API + author archives) is exposed by default in stock
# WordPress — no plugin needed. seed.sh just adds a few users with posts so
# there is something to enumerate.

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html

  # One-shot WP-CLI container, only used by seed.sh (does not start with `up`).
  wpcli:
    image: wordpress:cli
    profiles: ["cli"]
    depends_on:
      - wordpress
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html

volumes:
  db_data:
  wp_data:
